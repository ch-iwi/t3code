name: DV³ desktop build

# fork(ch-iwi): Unsigned DV³ Code installers on GitHub-hosted runners, uploaded
# as run artifacts and attached to a draft GitHub release (tag dv3-v<version>)
# with generated notes. Upstream's release.yml needs Blacksmith runners, its
# signing secrets, and T3 Connect config, none of which this fork has.
#
# Windows builds without the embedded WSL runtime, so its WSL backend is
# unavailable; the native Windows backend works.

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Release build: version it as dv3-version.json as is, without the -dv3.<date>.<commit count> suffix."
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            runner: macos-15
            platform: mac
            target: dmg
            arch: arm64
            rust_target: aarch64-apple-darwin
          - label: Linux x64
            runner: ubuntu-24.04
            platform: linux
            target: AppImage
            arch: x64
            rust_target: x86_64-unknown-linux-gnu
          - label: Windows x64
            runner: windows-2025
            platform: win
            target: nsis
            arch: x64
            rust_target: x86_64-pc-windows-msvc
    steps:
      # Sparse checkout skips the vendored .repos tree, whose orphaned gitlinks
      # break actions/checkout's submodule cleanup. The full commit history
      # (without old file contents) is fetched because the build version
      # counts the commits on HEAD.
      - name: Checkout
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --filter=blob:none origin "$GITHUB_SHA"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git -c checkout.workers=0 checkout --detach FETCH_HEAD

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: ${{ matrix.platform != 'win' }}
          run-install: false

      - name: Install dependencies
        run: vp install

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust_target }}

      - name: Install Spectre-mitigated MSVC libs
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -products * -latest -property installationPath
          $setupExe = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $proc = Start-Process -FilePath $setupExe `
            -ArgumentList "modify", "--installPath", "`"$installPath`"", "--add", `
            "Microsoft.VisualStudio.Component.VC.Runtimes.x86.x64.Spectre", "--quiet", "--norestart" `
            -Wait -PassThru -NoNewWindow
          if ($null -eq $proc -or $proc.ExitCode -ne 0) {
            $code = if ($null -ne $proc) { $proc.ExitCode } else { 1 }
            Write-Error "Visual Studio Installer failed with exit code $code"
            exit $code
          }

      - name: Install Linux desktop build libraries
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev pkg-config imagemagick

      - name: Build desktop artifact
        shell: bash
        env:
          DV3_RELEASE: ${{ inputs.release }}
        run: |
          vp run dist:desktop:artifact \
            --platform "${{ matrix.platform }}" \
            --target "${{ matrix.target }}" \
            --arch "${{ matrix.arch }}" \
            --verbose

      - name: Upload installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: DV3-Code-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/DV3-Code-*
            !release/*.blockmap
          if-no-files-found: error

  release:
    name: Draft GitHub release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # The notes need the full history, the earlier dv3-v* release tags, and
      # upstream's main to tell fork commits from upstream ones.
      - name: Checkout
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git remote add upstream https://github.com/pingdotgg/t3code.git
          git fetch --no-tags --filter=blob:none origin "$GITHUB_SHA" '+refs/tags/dv3-v*:refs/tags/dv3-v*'
          git fetch --no-tags --filter=blob:none upstream '+refs/heads/main:refs/remotes/upstream/main'
          git sparse-checkout set --no-cone '/.github/scripts/'
          git -c checkout.workers=0 checkout --detach "$GITHUB_SHA"

      - name: Download installers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: DV3-Code-*
          path: installers
          merge-multiple: true

      # Only the installers: the macOS zip exists for auto-updates, which DV³
      # releases don't offer.
      - name: Create draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # gh would otherwise prefer the remote named upstream.
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          dmg=$(basename installers/DV3-Code-*-arm64.dmg)
          version=${dmg#DV3-Code-}
          version=${version%-arm64.dmg}
          tag="dv3-v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::A release for $tag already exists. Delete it or build a newer commit." >&2
            exit 1
          fi
          bash .github/scripts/dv3-release-notes.sh "$version" upstream/main "$RUN_URL" > notes.md
          prerelease=()
          if [[ $version == *-* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$tag" --draft "${prerelease[@]}" \
            --target "$GITHUB_SHA" \
            --title "DV³ Code $version" \
            --notes-file notes.md \
            installers/*.dmg installers/*.exe installers/*.AppImage
          echo "Drafted $tag: review the notes and publish it on GitHub." >> "$GITHUB_STEP_SUMMARY"
